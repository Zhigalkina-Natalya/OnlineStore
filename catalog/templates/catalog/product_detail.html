{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ product.name }} — SkyStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <div class="row">
        <div class="col-md-6">
            {% if product.image %}
                <img src="{{ product.image.url }}" class="img-fluid rounded" alt="{{ product.name }}">
            {% else %}
                <img src="{% static 'img/no-image.png' %}" class="img-fluid rounded" alt="Нет изображения">
            {% endif %}
        </div>
        <div class="col-md-6">
            <h2>{{ product.name }}</h2>
            <p class="text-muted">{{ product.category.name }}</p>
            <p>{{ product.description }}</p>
            <h4 class="text-success">Цена: {{ product.price }} ₽</h4>

            <a href="{% url 'catalog:home' %}" class="btn btn-outline-primary mt-3">Назад в каталог</a>
        </div>
    </div>

    <footer class="pt-4 my-md-5 pt-md-5 border-top">
        <small class="d-block mb-3 text-muted">&copy; 2025 SkyStore</small>
    </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
